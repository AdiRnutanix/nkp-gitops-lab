apiVersion: clusters.nkp.nutanix.com/v1alpha1
kind: NKPCluster
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    cluster.x-k8s.io/provider: nutanix
    konvoy.d2iq.io/cluster-name: lab-dev
    konvoy.d2iq.io/provider: nutanix
  name: lab-dev
  namespace: lab-gitops-ws
spec:
  capiCluster:
    clusterNetwork:
      pods:
        cidrBlocks:
        - 192.168.0.0/16
      services:
        cidrBlocks:
        - 10.96.0.0/12
    topology:
      classRef:
        name: nkp-nutanix-v2.19.0
      controlPlane:
        replicas: 1
      variables:
      - name: clusterConfig
        value:
          addons:
            ccm:
              credentials:
                secretRef:
                  name: lab-dev-pc-credentials-for-ccm
              strategy: HelmAddon
            clusterAutoscaler:
              strategy: HelmAddon
            cni:
              provider: Cilium
              strategy: HelmAddon
            cosi:
              strategy: HelmAddon
            csi:
              defaultStorage:
                provider: nutanix
                storageClassConfig: volume
              providers:
                nutanix:
                  credentials:
                    secretRef:
                      name: lab-dev-pc-credentials-for-csi
                  storageClassConfigs:
                    volume:
                      allowExpansion: true
                      parameters:
                        csi.storage.k8s.io/fstype: ext4
                        description: CSI StorageClass nutanix-volume for lab-dev
                        flashMode: DISABLED
                        hypervisorAttached: ENABLED
                        storageContainer: nkp
                        storageType: NutanixVolumes
                      reclaimPolicy: Delete
                      volumeBindingMode: WaitForFirstConsumer
                  strategy: HelmAddon
              snapshotController:
                strategy: HelmAddon
            konnectorAgent:
              credentials:
                secretRef:
                  name: lab-dev-pc-credentials-for-konnector-agent
              enableKubeconfigUpload: true
            nfd:
              strategy: HelmAddon
            serviceLoadBalancer:
              configuration:
                addressRanges:
                - end: 10.136.137.246
                  start: 10.136.137.246
              provider: MetalLB
          controlPlane:
            autoRenewCertificates:
              daysBeforeExpiry: 180
            nodeRegistration:
              ignorePreflightErrors:
              - SystemVerification
            nutanix:
              machineDetails:
                bootType: uefi
                cluster:
                  name: Trigonometry
                  type: name
                image:
                  name: nkp-rocky-9.8-release-cis-1.36.2-20261014035643.qcow2
                  type: name
                memorySize: 16Gi
                project:
                  name: nkp-rg-test
                  type: name
                subnets:
                - name: VLAN-136-IPAM
                  type: name
                systemDiskSize: 80Gi
                vcpuSockets: 4
                vcpusPerSocket: 1
          dns:
            coreDNS: {}
          encryptionAtRest:
            providers:
            - secretbox: {}
          imageRegistries:
          - credentials:
              secretRef:
                name: lab-dev-dockerhub-nutanix-credentials
            url: https://registry-1.docker.io/nutanix
          kubeProxy:
            mode: disabled
          ntp:
            servers:
            - pool.ntp.org
            - time.google.com
          nutanix:
            controlPlaneEndpoint:
              host: 10.136.137.245
              port: 6443
              virtualIP:
                provider: KubeVIP
            prismCentralEndpoint:
              additionalTrustBundle: 
              credentials:
                secretRef:
                  name: lab-dev-pc-credentials
              url: https://10.136.136.8:9440
          users:
          - name: konvoy
            sshAuthorizedKeys:
            - |
              ssh-rsa 
            sudo: ALL=(ALL) NOPASSWD:ALL
      version: v1.36.2
      workers:
        machineDeployments:
        - class: default-worker
          metadata:
            annotations:
              cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "1"
              cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "1"
          name: md-0
          variables:
            overrides:
            - name: workerConfig
              value:
                nodeRegistration:
                  ignorePreflightErrors:
                  - SystemVerification
                nutanix:
                  machineDetails:
                    bootType: uefi
                    cluster:
                      name: Trigonometry
                      type: name
                    image:
                      name: nkp-rocky-9.8-release-cis-1.36.2-20261014035643.qcow2
                      type: name
                    memorySize: 16Gi
                    project:
                      name: nkp-rg-test
                      type: name
                    subnets:
                    - name: VLAN-136-IPAM
                      type: name
                    systemDiskSize: 80Gi
                    vcpuSockets: 4
                    vcpusPerSocket: 1
  version: v2.19.0
